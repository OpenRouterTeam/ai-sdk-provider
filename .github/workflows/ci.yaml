name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - name: Type-check packed tarball in consumer projects
        # Layouts: pnpm isolated (hoist=false), pnpm global virtual store,
        # pnpm hoisted, npm. `ai` versions: peer floor, devDependency, latest.
        run: pnpm check:consumer-types --concurrency=4
      - run: pnpm typecheck
      - run: pnpm stylecheck
