name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - run: pnpm install
      - run: pnpm test
      - run: pnpm build
      - name: Type-check packed tarball in consumer projects
        # Layouts: pnpm isolated (hoist=false), pnpm global virtual store,
        # pnpm hoisted, npm. `ai` versions: peer floor, devDependency, latest.
        run: pnpm check:consumer-types --concurrency=4
      - run: pnpm typecheck
      - run: pnpm stylecheck
